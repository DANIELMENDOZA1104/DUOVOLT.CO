<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="recursos/logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud recibida | DuoVolt</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#020817;
  font-family:Arial,sans-serif;
  color:white;
  padding:20px;
}

.card{
  max-width:600px;
  width:100%;
  background:#07101f;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:50px 40px;
  text-align:center;
}

.icon{
  width:90px;
  height:90px;
  margin:0 auto 25px;
  border-radius:50%;
  background:rgba(95,209,63,.15);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:42px;
}

h1{
  font-size:34px;
  margin-bottom:15px;
}

p{
  color:#94a3b8;
  line-height:1.7;
  margin-bottom:30px;
}

.btn{
  display:inline-block;
  background:#5fd13f;
  color:white;
  text-decoration:none;
  padding:14px 28px;
  border-radius:10px;
  font-weight:600;
  transition:.3s;
}

.btn:hover{
  background:#4cad36;
}

</style>
</head>

<body>

<div class="card">

  <div class="icon">✓</div>

  <h1>¡Solicitud recibida!</h1>

  <p>
    Gracias por confiar en DuoVolt.
    Hemos recibido tu información correctamente y uno de nuestros especialistas se pondrá en contacto contigo para analizar tu proyecto.
  </p>

  <a href="index.html" class="btn">
    Volver al inicio
  </a>

</div>

</body>
</html>
